name: Release Build
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: "1.6.0"
        type: string
      build_date:
        description: Build metadata date in YYYYMMDD format
        required: true
        default: "20260726"
        type: string
      publish_release:
        description: Create or update the GitHub Release
        required: true
        default: true
        type: boolean
      release_prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: true
        type: boolean
      allow_release_update:
        description: Allow updating an existing release tag and its assets
        required: true
        default: false
        type: boolean
      publish_docker:
        description: Push versioned and latest Docker images to GHCR
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: r25c
  COMMIT_ID: "${{ github.sha }}"
  APP_RUNNER_URL: "https://d1.sealdice.com/lagrange/app-runner-std-arm64.tar.gz"
  APP_RUNNER_SHA256: "5df665ac06223eb89c9552263ee3ce790a9e9d1cbd13ca53ec82f890168051c6"
  LAGRANGE_VERSION: "0.0.6"
  LAGRANGE_V2_BASE_URL: "https://github.com/sealdice/LagrangeV2/releases/download/nightly"
  LAGRANGE_V2_LINUX_ARM64_SHA256: "b80ae8e55f23ab223b3c349a4185a1133fb219e060b0c395778040eb5e0bbe84"
  LAGRANGE_V2_LINUX_AMD64_SHA256: "0d84fada259a4555fdc33aa35ed5a899a3c9da13197665ee16fd59bec0a727cc"
  LAGRANGE_V2_DARWIN_ARM64_SHA256: "d7375de075e7d443e1388e0f35e21a1c0ee2b45f8dbd723ef560e34a7be7b33e"
  LAGRANGE_V2_WINDOWS_AMD64_SHA256: "fcc4405cd265b86b347253081246a6fada3b1c8ef21bf7db39b6b80112ae263b"
  YOGURT_BASE_URL: "https://github.com/sealdice/acidify/releases/download/dev"
  YOGURT_ANDROID_ARM64_SHA256: "a8e2440857afb14e3b7516622cd3abdcfc4bbca8d80bed36765f5571911c10ce"
  YOGURT_LINUX_ARM64_SHA256: "53833d7f034a663bc731be8e0d84419d04555abfaaffccd9944659026fbbd977"
  YOGURT_LINUX_AMD64_SHA256: "c691e1ffa73e1d2a81f2caa7602f379075dd2d51fcfc32c83b0c939c39450312"
  YOGURT_DARWIN_ARM64_SHA256: "6b6b0cf0d1fdc22d415a8d63f6af8f6b5512bcb02abc38b8718cdd35272af8de"
  YOGURT_WINDOWS_AMD64_SHA256: "1ba226a5aa569cd78ef72158b063a0b27aa7b03e7bc5038f4d51822c84bfb5ae"
  NT_SIGN_URL: ${{ secrets.NT_SIGN_URL }}

jobs:
  commit-num-check:
    name: Release Metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Get Commit IDs
        id: get-commit-ids
        run: |
          echo "UI_CID=`cd sealdice-ui && git rev-parse HEAD`" >> $GITHUB_OUTPUT;
          echo "CORE_CID=`cd sealdice-core && git rev-parse HEAD`" >> $GITHUB_OUTPUT;
          # echo "ANDROID_VERSION=`cd sealdice-android && git describe --tags --abbrev=0`" >> $GITHUB_OUTPUT;
          echo "ANDROID_VERSION=v0.6.1" >> $GITHUB_OUTPUT;

      - name: Get Version
        id: get-version
        env:
          PROJECT_VERSION_INPUT: ${{ inputs.version }}
          BUILD_DATE_INPUT: ${{ inputs.build_date }}
        run: |
          set -euo pipefail
          if [[ ! "$PROJECT_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release version: $PROJECT_VERSION_INPUT" >&2
            exit 1
          fi
          if [[ ! "$BUILD_DATE_INPUT" =~ ^[0-9]{8}$ ]]; then
            echo "Invalid build date: $BUILD_DATE_INPUT" >&2
            exit 1
          fi
          echo "PROJECT_VERSION=$PROJECT_VERSION_INPUT" >> "$GITHUB_OUTPUT"
          echo "PROJECT_VERSION_DISPLAY=v${PROJECT_VERSION_INPUT} v${BUILD_DATE_INPUT}" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=$BUILD_DATE_INPUT" >> "$GITHUB_OUTPUT"

      - name: Validate Signing Configuration
        env:
          SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
          SEAL_SIGN_PRIVATE_KEY: ${{ secrets.SEAL_SIGN_PRIVATE_KEY }}
          SEAL_SIGN_V3_URL: ${{ secrets.SEAL_SIGN_V3_URL }}
        run: |
          set -euo pipefail
          : "${SEAL_TRUSTED_PRIVATE_KEY:?SEAL_TRUSTED_PRIVATE_KEY is not configured}"
          : "${SEAL_SIGN_PRIVATE_KEY:?SEAL_SIGN_PRIVATE_KEY is not configured}"
          : "${SEAL_SIGN_V3_URL:?SEAL_SIGN_V3_URL is not configured}"
    outputs:
      CORE_CID: ${{ steps.get-commit-ids.outputs.CORE_CID }}
      UI_CID: ${{ steps.get-commit-ids.outputs.UI_CID }}
      ANDROID_VERSION: ${{ steps.get-commit-ids.outputs.ANDROID_VERSION }}
      PROJECT_VERSION: ${{ steps.get-version.outputs.PROJECT_VERSION }}
      PROJECT_VERSION_DISPLAY: ${{ steps.get-version.outputs.PROJECT_VERSION_DISPLAY }}
      BUILD_DATE: ${{ steps.get-version.outputs.BUILD_DATE }}
      SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}

  resources-download:
    name: Download Related Resources
    runs-on: ubuntu-latest
    needs: commit-num-check
    steps:
      - name: Code
        uses: actions/checkout@v5
        with:
          submodules: true
      - name: Upload Documents
        uses: actions/upload-artifact@v4
        with:
          name: documents
          path: ./sealdice-builtins/data

  lagrange-download:
    name: Download Lagrange
    runs-on: ubuntu-latest
    needs: commit-num-check
    steps:
      - name: Download
        run: |
          set -euo pipefail
          mkdir lag
          base_url="https://d1.sealdice.com/lagrange/${LAGRANGE_VERSION}"
          curl --fail --location --retry 3 --retry-all-errors --output lag/Lagrange.OneBot.linux-arm64.zip "$base_url/Lagrange.OneBot_linux-arm64_8.0.zip"
          curl --fail --location --retry 3 --retry-all-errors --output lag/Lagrange.OneBot.linux-amd64.zip "$base_url/Lagrange.OneBot_linux-x64_8.0.zip"
          curl --fail --location --retry 3 --retry-all-errors --output lag/Lagrange.OneBot.windows-amd64.zip "$base_url/Lagrange.OneBot_win-x64_8.0.zip"
          curl --fail --location --retry 3 --retry-all-errors --output lag/Lagrange.OneBot.darwin-arm64.zip "$base_url/Lagrange.OneBot_osx-arm64_8.0.zip"
          curl --fail --location --retry 3 --retry-all-errors --output lag/Lagrange.OneBot.darwin-amd64.zip "$base_url/Lagrange.OneBot_osx-x64_8.0.zip"
          curl --fail --location --retry 3 --retry-all-errors --output lag/Lagrange.OneBot.android-arm64.zip "$base_url/Lagrange.OneBot_linux-musl-arm64_8.0.zip"
          for archive in lag/*.zip; do unzip -t "$archive" >/dev/null; done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lagrange
          path: ./lag

  lagrange-v2-download:
    name: Download LagrangeV2
    runs-on: ubuntu-latest
    needs: commit-num-check
    steps:
      - name: Download
        run: |
          set -euo pipefail
          mkdir milky
          download() {
            curl --fail --location --retry 3 --retry-all-errors --output "$2" "$1"
            echo "$3  $2" | sha256sum --check -
          }
          download "$LAGRANGE_V2_BASE_URL/Lagrange.Milky-linux-arm64" milky/lagrangeV2.linux-arm64 "$LAGRANGE_V2_LINUX_ARM64_SHA256"
          download "$LAGRANGE_V2_BASE_URL/Lagrange.Milky-linux-x64" milky/lagrangeV2.linux-amd64 "$LAGRANGE_V2_LINUX_AMD64_SHA256"
          download "$LAGRANGE_V2_BASE_URL/Lagrange.Milky-osx-arm64" milky/lagrangeV2.darwin-arm64 "$LAGRANGE_V2_DARWIN_ARM64_SHA256"
          download "$LAGRANGE_V2_BASE_URL/Lagrange.Milky-win-x64.exe" milky/lagrangeV2.windows-amd64.exe "$LAGRANGE_V2_WINDOWS_AMD64_SHA256"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lagrangeV2
          path: ./milky

  yogurt-download:
    name: Download Yogurt
    runs-on: ubuntu-latest
    needs: commit-num-check
    steps:
      - name: Download
        run: |
          set -euo pipefail
          mkdir milky
          download() {
            curl --fail --location --retry 3 --retry-all-errors --output "$2" "$1"
            echo "$3  $2" | sha256sum --check -
            unzip -t "$2" >/dev/null
          }
          download "$YOGURT_BASE_URL/yogurt-android-arm64.zip" milky/yogurt.android-arm64.zip "$YOGURT_ANDROID_ARM64_SHA256"
          download "$YOGURT_BASE_URL/yogurt-linux-arm64.zip" milky/yogurt.linux-arm64.zip "$YOGURT_LINUX_ARM64_SHA256"
          download "$YOGURT_BASE_URL/yogurt-linux-x64.zip" milky/yogurt.linux-amd64.zip "$YOGURT_LINUX_AMD64_SHA256"
          download "$YOGURT_BASE_URL/yogurt-macos-arm64.zip" milky/yogurt.darwin-arm64.zip "$YOGURT_DARWIN_ARM64_SHA256"
          download "$YOGURT_BASE_URL/yogurt-windows-x64.zip" milky/yogurt.windows-amd64.zip "$YOGURT_WINDOWS_AMD64_SHA256"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: yogurt
          path: ./milky


  lagrange-setup:
    name: Download Lagrange
    runs-on: ubuntu-latest
    needs: lagrange-download
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: android
            goarch: arm64
    steps:
      - name: Get Lagrange
        uses: actions/download-artifact@v4
        with:
          name: lagrange
          path: ./lagrange

      - name: Extract
        run: |
          mkdir extract
          ls ./lagrange/Lagrange.OneBot.${{ matrix.goos }}-${{ matrix.goarch }}.zip
          file ./lagrange/Lagrange.OneBot.${{ matrix.goos }}-${{ matrix.goarch }}.zip
          unzip ./lagrange/Lagrange.OneBot.${{ matrix.goos }}-${{ matrix.goarch }}.zip -d ./extract/Lagrange.OneBot.${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lagrange.${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./extract/Lagrange.OneBot.${{ matrix.goos }}-${{ matrix.goarch }}
  lagrange-v2-setup:
    name: Prepare LagrangeV2
    runs-on: ubuntu-latest
    needs: lagrange-v2-download
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Get LagrangeV2
        uses: actions/download-artifact@v4
        with:
          name: lagrangeV2
          path: ./milky

      - name: Prepare Executable
        if: matrix.goos != 'windows'
        run: |
          install -D -m 0755 ./milky/lagrangeV2.${{ matrix.goos }}-${{ matrix.goarch }} ./milkytmp/lagrangeV2.${{ matrix.goos }}-${{ matrix.goarch }}/lagrangeV2

      - name: Prepare Windows Executable
        if: matrix.goos == 'windows'
        run: |
          mkdir -p ./milkytmp/lagrangeV2.${{ matrix.goos }}-${{ matrix.goarch }}
          mv ./milky/lagrangeV2.${{ matrix.goos }}-${{ matrix.goarch }}.exe ./milkytmp/lagrangeV2.${{ matrix.goos }}-${{ matrix.goarch }}/lagrangeV2.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lagrangeV2.${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./milkytmp/lagrangeV2.${{ matrix.goos }}-${{ matrix.goarch }}

  yogurt-setup:
    name: Prepare Yogurt
    runs-on: ubuntu-latest
    needs: yogurt-download
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: android
            goarch: arm64
    steps:
      - name: Get Yogurt
        uses: actions/download-artifact@v4
        with:
          name: yogurt
          path: ./milky

      - name: Extract
        run: |
          mkdir -p ./extract/yogurt.${{ matrix.goos }}-${{ matrix.goarch }}
          unzip -q ./milky/yogurt.${{ matrix.goos }}-${{ matrix.goarch }}.zip -d ./extract/yogurt.${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Prepare Executable
        if: matrix.goos != 'windows'
        run: |
          mv ./extract/yogurt.${{ matrix.goos }}-${{ matrix.goarch }}/yogurt.kexe ./extract/yogurt.${{ matrix.goos }}-${{ matrix.goarch }}/yogurt
          chmod 0755 ./extract/yogurt.${{ matrix.goos }}-${{ matrix.goarch }}/yogurt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: yogurt.${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./extract/yogurt.${{ matrix.goos }}-${{ matrix.goarch }}


  ui-build:
    name: Build UI
    runs-on: ubuntu-latest
    needs: commit-num-check
    env:
      UI_CID: ${{needs.commit-num-check.outputs.UI_CID}}
    steps:
      - name: Cache ui dist get
        id: cache-ui-dist
        uses: actions/cache@v5
        env:
          cache-name: cache-ui-dist
        with:
          path: ./sealdice-ui/dist
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ env.UI_CID }}

      - name: Code
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - if: ${{ steps.cache-ui-dist.outputs.cache-hit == 'true' }}
        name: Show cache
        continue-on-error: true
        run: ls ./sealdice-ui/dist

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        with:
          version: 10
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v5
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sealdice-ui/pnpm-lock.yaml

      - name: Install Dependencies
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        working-directory: ./sealdice-ui
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        working-directory: ./sealdice-ui
        run: pnpm run build

      - name: Upload UI
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-ui/dist

  core-build:
    name: Build Core
    runs-on: ubuntu-22.04
    needs:
      - commit-num-check
      - ui-build
    env:
      BUILD_DATE: ${{needs.commit-num-check.outputs.BUILD_DATE}}
      CORE_CID: ${{needs.commit-num-check.outputs.CORE_CID}}
      PROJECT_VERSION: ${{needs.commit-num-check.outputs.PROJECT_VERSION}}
      SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
    strategy:
      matrix:
        # target: linux/amd64, linux/arm64, windows/amd64
        goos: [ linux, windows ]
        goarch: [ amd64, arm64 ]
        exclude:
          - goos: windows
            goarch: arm64
      fail-fast: true
    steps:
      - name: Apt-get Update
        run: sudo apt-get update

      - name: Code
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Cross-compiler for Windows
        if: matrix.goos == 'windows'
        run: sudo apt-get -y install mingw-w64
      - name: Install Cross-compiler for Linux Arm64
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: sudo apt-get -y install gcc-aarch64-linux-gnu
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
      - name: Apply Go Patch
        run: |
          set -eo pipefail
          GO_VERSION=$(go env GOVERSION)
          GO_VERSION=${GO_VERSION#go}
          IFS='.' read -r MAJOR MINOR _ <<< "$GO_VERSION"
          MAJOR=${MAJOR%%[^0-9]*}
          MINOR=${MINOR%%[^0-9]*}
          if [[ -z "$MAJOR" || -z "$MINOR" ]]; then
            echo "Unable to determine Go minor version from ${GO_VERSION}, skipping patch."
            exit 0
          fi
          PATCH_FILE="${GITHUB_WORKSPACE}/.github/patch_go/unified-${MAJOR}-${MINOR}-patch.diff"
          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "No Go patch found for unified-${MAJOR}-${MINOR}, skipping."
            exit 0
          fi
          GOROOT=$(go env GOROOT)
          echo "Applying Go patch ${PATCH_FILE} to ${GOROOT}"
          if patch --directory="$GOROOT" --dry-run -p1 < "$PATCH_FILE" >/dev/null 2>&1; then
            patch --directory="$GOROOT" -p1 < "$PATCH_FILE"
          else
            echo "Patch appears already applied or incompatible, skipping."
          fi
      - name: Install Dependencies
        working-directory: ./sealdice-core
        run: |
          go mod tidy
          go get .
      - name: Get UI Resources
        uses: actions/download-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-core/static/frontend
      - name: Set Env
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        working-directory: ./sealdice-core
        run: |
          if [ $GOOS = 'windows' ]; then
            echo "BINARY_NAME=sealdice-core.exe" >> $GITHUB_ENV;
          else
            echo "BINARY_NAME=sealdice-core" >> $GITHUB_ENV;
          fi
          if [ $GOOS = 'windows' ] && [ $GOARCH = '386' ]; then
            echo "CC=i686-w64-mingw32-gcc" >> $GITHUB_ENV;
          elif [ $GOOS = 'windows' ] && [ $GOARCH = 'amd64' ]; then
            echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV;
          elif [ $GOOS = 'linux' ] && [ $GOARCH = 'amd64' ]; then
            echo "CC=gcc" >> $GITHUB_ENV;
          elif [ $GOOS = 'linux' ] && [ $GOARCH = 'arm64' ]; then
            echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV;
          fi
      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO111MODULE: on
          # CGO_ENABLED: ${{ matrix.goarch != 'arm64' && 1 || 0 }}
          CGO_ENABLED: ${{ matrix.goos == 'windows' && 1 || 0 }} # 为了规避glibc兼容问题，linux上不使用cgo
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2 -H=windowsgui
          SEAL_SIGN_PRIVATE_KEY: ${{ secrets.SEAL_SIGN_PRIVATE_KEY }}
          SEAL_SIGN_V3_URL: ${{ secrets.SEAL_SIGN_V3_URL }}
        working-directory: ./sealdice-core
        run: go build -o "output/$BINARY_NAME" -trimpath -ldflags "-s -w -X sealdice-core/dice.VERSION_MAIN=${PROJECT_VERSION} -X sealdice-core/dice.VERSION_PRERELEASE= -X sealdice-core/dice.VERSION_BUILD_METADATA=+${BUILD_DATE} -X sealdice-core/dice.APP_CHANNEL=stable -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignClientPrivateKey=${SEAL_SIGN_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignV3Url=${SEAL_SIGN_V3_URL}'" .

      - name: Run UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: ./sealdice-core/output/${{ env.BINARY_NAME }}
          args: -9 -fq

      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ./sealdice-core/output

  core-darwin-build:
    name: Build Core
    runs-on: macos-latest
    needs:
      - commit-num-check
      - ui-build
    env:
      CORE_CID: ${{needs.commit-num-check.outputs.CORE_CID}}
      PROJECT_VERSION: ${{needs.commit-num-check.outputs.PROJECT_VERSION}}
      BUILD_DATE: ${{needs.commit-num-check.outputs.BUILD_DATE}}
      SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
    strategy:
      matrix:
        # target: darwin/amd64 darwin/arm64
        goos: [ darwin ]
        goarch: [ amd64, arm64 ]
      fail-fast: true
    steps:
      - name: Code
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
      - name: Apply Go Patch
        run: |
          set -eo pipefail
          GO_VERSION=$(go env GOVERSION)
          GO_VERSION=${GO_VERSION#go}
          IFS='.' read -r MAJOR MINOR _ <<< "$GO_VERSION"
          MAJOR=${MAJOR%%[^0-9]*}
          MINOR=${MINOR%%[^0-9]*}
          if [[ -z "$MAJOR" || -z "$MINOR" ]]; then
            echo "Unable to determine Go minor version from ${GO_VERSION}, skipping patch."
            exit 0
          fi
          PATCH_FILE="${GITHUB_WORKSPACE}/.github/patch_go/unified-${MAJOR}-${MINOR}-patch.diff"
          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "No Go patch found for unified-${MAJOR}-${MINOR}, skipping."
            exit 0
          fi
          GOROOT=$(go env GOROOT)
          echo "Applying Go patch ${PATCH_FILE} to ${GOROOT}"
          if patch --directory="$GOROOT" --dry-run -p1 < "$PATCH_FILE" >/dev/null 2>&1; then
            patch --directory="$GOROOT" -p1 < "$PATCH_FILE"
          else
            echo "Patch appears already applied or incompatible, skipping."
          fi
      - name: Install dependencies
        working-directory: ./sealdice-core
        run: |
          go mod tidy
          go get .
      - name: Get UI Resources
        uses: actions/download-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-core/static/frontend
      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO111MODULE: on
          CGO_ENABLED: 1
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2
          SEAL_SIGN_PRIVATE_KEY: ${{ secrets.SEAL_SIGN_PRIVATE_KEY }}
          SEAL_SIGN_V3_URL: ${{ secrets.SEAL_SIGN_V3_URL }}
        working-directory: ./sealdice-core
        run: go build -o "output/sealdice-core" -trimpath -ldflags "-s -w -X sealdice-core/dice.VERSION_MAIN=${PROJECT_VERSION} -X sealdice-core/dice.VERSION_PRERELEASE= -X sealdice-core/dice.VERSION_BUILD_METADATA=+${BUILD_DATE} -X sealdice-core/dice.APP_CHANNEL=stable -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignClientPrivateKey=${SEAL_SIGN_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignV3Url=${SEAL_SIGN_V3_URL}'" .

      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ./sealdice-core/output

  core-android-build:
    name: Build Core (android, arm64)
    runs-on: ubuntu-22.04
    if: ${{ inputs.publish_release }}
    needs:
      - commit-num-check
      - ui-build
    env:
      CORE_CID: ${{needs.commit-num-check.outputs.CORE_CID}}
      PROJECT_VERSION: ${{needs.commit-num-check.outputs.PROJECT_VERSION}}
      BUILD_DATE: ${{needs.commit-num-check.outputs.BUILD_DATE}}
      SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
    steps:
      - name: Code
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          link-to-sdk: true
          local-cache: false
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
      - name: Apply Go Patch
        run: |
          set -eo pipefail
          GO_VERSION=$(go env GOVERSION)
          GO_VERSION=${GO_VERSION#go}
          IFS='.' read -r MAJOR MINOR _ <<< "$GO_VERSION"
          MAJOR=${MAJOR%%[^0-9]*}
          MINOR=${MINOR%%[^0-9]*}
          if [[ -z "$MAJOR" || -z "$MINOR" ]]; then
            echo "Unable to determine Go minor version from ${GO_VERSION}, skipping patch."
            exit 0
          fi
          PATCH_FILE="${GITHUB_WORKSPACE}/.github/patch_go/unified-${MAJOR}-${MINOR}-patch.diff"
          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "No Go patch found for unified-${MAJOR}-${MINOR}, skipping."
            exit 0
          fi
          GOROOT=$(go env GOROOT)
          echo "Applying Go patch ${PATCH_FILE} to ${GOROOT}"
          if patch --directory="$GOROOT" --dry-run -p1 < "$PATCH_FILE" >/dev/null 2>&1; then
            patch --directory="$GOROOT" -p1 < "$PATCH_FILE"
          else
            echo "Patch appears already applied or incompatible, skipping."
          fi
      - name: Install dependencies
        working-directory: ./sealdice-core
        run: |
          go mod tidy
          go get .
      - name: Get UI Resources
        uses: actions/download-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-core/static/frontend
      - name: Build binary
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2
          SEAL_SIGN_PRIVATE_KEY: ${{ secrets.SEAL_SIGN_PRIVATE_KEY }}
          SEAL_SIGN_V3_URL: ${{ secrets.SEAL_SIGN_V3_URL }}
        working-directory: ./sealdice-core
        run: go build -o "output/sealdice-core" -trimpath -ldflags "-s -w -X sealdice-core/dice.VERSION_MAIN=${PROJECT_VERSION} -X sealdice-core/dice.VERSION_PRERELEASE= -X sealdice-core/dice.VERSION_BUILD_METADATA=+${BUILD_DATE} -X sealdice-core/dice.APP_CHANNEL=stable -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignClientPrivateKey=${SEAL_SIGN_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignV3Url=${SEAL_SIGN_V3_URL}'" .
      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION }}_android_arm64
          path: ./sealdice-core/output

  android-build:
    name: Build Android Apk
    runs-on: ubuntu-22.04
    needs:
      - commit-num-check
      - core-android-build
      - resources-download
      - lagrange-setup
      - lagrange-v2-setup
      - yogurt-setup
    env:
      PROJECT_VERSION: ${{needs.commit-num-check.outputs.PROJECT_VERSION}}
      ANDROID_VERSION: ${{needs.commit-num-check.outputs.ANDROID_VERSION}}
    steps:
      - name: Code
        uses: actions/checkout@v5
        with:
          submodules: true
      - name: Get Core-android
        uses: actions/download-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION }}_android_arm64
          path: ./sealdice-android/app/src/main/assets/sealdice
      - name: Get Documents
        uses: actions/download-artifact@v4
        with:
          name: documents
          path: ./sealdice-android/app/src/main/assets/sealdice/data

      - name: Get App-Runner
        run: |
          set -euo pipefail
          output=./sealdice-android/app/src/main/assets/app-runner-arm64.tar.gz
          curl --fail --location --retry 3 --retry-all-errors --output "$output" "$APP_RUNNER_URL"
          echo "$APP_RUNNER_SHA256  $output" | sha256sum --check -
          tar -tzf "$output" >/dev/null

      - name: Get Lagrange
        uses: actions/download-artifact@v4
        with:
          name: lagrange.android-arm64
          path: ./sealdice-android/app/src/main/assets/sealdice/lagrange/

      - name: Get LagrangeV2
        uses: actions/download-artifact@v4
        with:
          name: lagrangeV2.linux-arm64
          path: ./sealdice-android/app/src/main/assets/sealdice/milky/

      - name: Get Yogurt
        uses: actions/download-artifact@v4
        with:
          name: yogurt.android-arm64
          path: ./sealdice-android/app/src/main/assets/sealdice/milky/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Set Execution Flag
        working-directory: ./sealdice-android
        run: chmod +x gradlew
      - name: Remove ARCA Config
        working-directory: ./sealdice-android/app/src/main/java/com/sealdice/dice
        run: |
          sed -i '/secrets.Auth.*/d' MyApplication.kt
          sed -i '/httpSender {/,/}/d' MyApplication.kt
      - name: Set Version
        working-directory: ./sealdice-android/app
        run: |
          sed -i 's/versionName ".*"/versionName "${{ env.PROJECT_VERSION }}"/g' build.gradle
      - name: Build Apk
        working-directory: ./sealdice-android
        run: |
          bash ./gradlew assembleRelease --stacktrace

      - name: Sign Android release
        uses: r0adkll/sign-android-release@v1
        # ID used to access action output
        id: sign_app
        with:
          releaseDirectory: ./sealdice-android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          # override default build-tools version (29.0.3) -- optional
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename Apk
        working-directory: ./sealdice-android
        run: |
          mv ./app/build/outputs/apk/release/app-release-unsigned-signed.apk ./app/build/outputs/apk/release/sealdice_android_${{ env.PROJECT_VERSION }}_arm64.apk

      - name: Upload Apk
        uses: actions/upload-artifact@v4
        with:
          name: sealdice_${{ env.PROJECT_VERSION }}_android_arm64
          path: ./sealdice-android/app/build/outputs/apk/release/sealdice_android_${{ env.PROJECT_VERSION }}_arm64.apk

  pc-pack:
    name: PC Pack
    runs-on: ubuntu-latest
    needs:
      - resources-download
      - core-build
      - core-darwin-build
      - commit-num-check
      - lagrange-setup
      - lagrange-v2-setup
      - yogurt-setup
    env:
      PROJECT_VERSION: ${{needs.commit-num-check.outputs.PROJECT_VERSION}}
    strategy:
      matrix:
        # target: linux/amd64, linux/arm64, windows/amd64, darwin/amd64, darwin/arm64
        goos: [ linux, windows, darwin ]
        goarch: [ amd64, arm64 ]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Get Documents
        uses: actions/download-artifact@v4
        with:
          name: documents
          path: ./data

      - name: Get Lagrange
        uses: actions/download-artifact@v4
        with:
          name: lagrange.${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./lagrange/

      - name: Get LagrangeV2
        if: matrix.goos != 'darwin' || matrix.goarch != 'amd64'
        uses: actions/download-artifact@v4
        with:
          name: lagrangeV2.${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./milky/

      - name: Get Yogurt
        if: matrix.goos != 'darwin' || matrix.goarch != 'amd64'
        uses: actions/download-artifact@v4
        with:
          name: yogurt.${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./milky/

      - name: Get Core
        uses: actions/download-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: .

      - name: Set Execute Attribute
        if: matrix.goos != 'windows'
        run: chmod +x ./sealdice-core

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sealdice_${{ env.PROJECT_VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: .

  preparation:
    name: Compressed Files Preparation
    runs-on: ubuntu-latest
    needs:
      - pc-pack
      - android-build
      - commit-num-check
    env:
      PROJECT_VERSION: ${{needs.commit-num-check.outputs.PROJECT_VERSION}}
      ANDROID_VERSION: ${{needs.commit-num-check.outputs.ANDROID_VERSION}}
    strategy:
      matrix:
        # target: linux/amd64, linux/arm64, windows/amd64, darwin/amd64, darwin/arm64, android/arm64
        goos: [ linux, windows, darwin ]
        goarch: [ amd64, arm64 ]
        exclude:
          - goos: windows
            goarch: arm64
        include:
          - goos: android
            goarch: arm64
    steps:
      - name: Get Files
        uses: actions/download-artifact@v4
        with:
          name: sealdice_${{ env.PROJECT_VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ./temp/
      - name: Compress (default)
        if: matrix.goos != 'windows' && matrix.goos != 'android'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          chmod +x ./temp/sealdice-core
          tar -zcvf sealdice-core_${PROJECT_VERSION}_${GOOS}_${GOARCH}.tar.gz -C ./temp .;
          echo "DIST=sealdice-core_${PROJECT_VERSION}_${GOOS}_${GOARCH}.tar.gz" >> $GITHUB_ENV;

      - name: Compress (windows)
        if: matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd ./temp
          zip -r ../sealdice-core_${PROJECT_VERSION}_${GOOS}_${GOARCH}.zip .
          echo "DIST=sealdice-core_${PROJECT_VERSION}_${GOOS}_${GOARCH}.zip" >> $GITHUB_ENV;

      - name: Prepare Android Artifact
        if: matrix.goos == 'android'
        env:
          GOARCH: ${{ matrix.goarch }}
          PROJECT_VERSION: ${{ env.PROJECT_VERSION }}
          ANDROID_VERSION: ${{ env.ANDROID_VERSION }}
        run: |
          SOURCE=$(find ./temp -name "sealdice_android_${PROJECT_VERSION}_${GOARCH}.apk" -print -quit)
          if [ -z "$SOURCE" ]; then
            echo "Android artifact sealdice_android_${PROJECT_VERSION}_${GOARCH}.apk not found under ./temp";
            exit 1;
          fi
          mv "$SOURCE" "./sealdice-android_${ANDROID_VERSION}_${PROJECT_VERSION}_${GOARCH}.APK"
          echo "DIST=sealdice-android_${ANDROID_VERSION}_${PROJECT_VERSION}_${GOARCH}.APK" >> $GITHUB_ENV;

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-prerelease_${{ env.PROJECT_VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.DIST }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_release }}
    needs:
      - preparation
      - android-build
      - commit-num-check
    env:
      PROJECT_VERSION: ${{needs.commit-num-check.outputs.PROJECT_VERSION}}
      PROJECT_VERSION_DISPLAY: ${{needs.commit-num-check.outputs.PROJECT_VERSION_DISPLAY}}
    permissions:
      contents: write
    steps:
      - name: Check Release Tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse Existing Release Tag
        if: ${{ inputs.allow_release_update == false }}
        env:
          RELEASE_TAG: v${{ env.PROJECT_VERSION }}
        run: |
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Release tag ${RELEASE_TAG} already exists. Enable allow_release_update to update it." >&2
            exit 1
          fi

      - name: Get Files
        uses: actions/download-artifact@v4
        with:
          pattern: sealdice-prerelease_${{ env.PROJECT_VERSION }}_*
          path: ./dist/
          merge-multiple: true
      - name: Pack All platform
        run: |
          cd ./dist
          zip -r ./sealdice-core_all_platform_${PROJECT_VERSION}.zip ./
      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.PROJECT_VERSION }}
          name: ${{ env.PROJECT_VERSION_DISPLAY }}
          prerelease: ${{ inputs.release_prerelease }}
          body: '[改动日志](https://sealdice.com/changelog)'
          artifacts: ./dist/sealdice*
          artifactErrorsFailBuild: true
          allowUpdates: ${{ inputs.allow_release_update }}
          removeArtifacts: ${{ inputs.allow_release_update }}
          replacesArtifacts: true

  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_docker }}
    needs:
      - pc-pack
      - commit-num-check
    env:
      PROJECT_VERSION: ${{needs.commit-num-check.outputs.PROJECT_VERSION}}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Get Amd64 Files
        uses: actions/download-artifact@v4
        with:
          name: sealdice_${{ env.PROJECT_VERSION }}_linux_amd64
          path: ./amd64/
      - name: Get Arm64 Files
        uses: actions/download-artifact@v4
        with:
          name: sealdice_${{ env.PROJECT_VERSION }}_linux_arm64
          path: ./arm64/

      - name: Chmod
        run:
          chmod +x ./amd64/sealdice-core && chmod +x ./arm64/sealdice-core

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sealdice
          tags: |
            type=raw,value=v${{ env.PROJECT_VERSION }}
            type=raw,value=latest
      - name: Docker Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            AUTHOR=${{ github.repository_owner }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-push-full:
    name: Docker Push (Full with Lagrange)
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_docker }}
    needs:
      - pc-pack
      - commit-num-check
    env:
      PROJECT_VERSION: ${{needs.commit-num-check.outputs.PROJECT_VERSION}}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Get Amd64 Files
        uses: actions/download-artifact@v4
        with:
          name: sealdice_${{ env.PROJECT_VERSION }}_linux_amd64
          path: ./amd64/
      - name: Get Arm64 Files
        uses: actions/download-artifact@v4
        with:
          name: sealdice_${{ env.PROJECT_VERSION }}_linux_arm64
          path: ./arm64/

      - name: Chmod
        run:
          chmod +x ./amd64/sealdice-core && chmod +x ./arm64/sealdice-core

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sealdice-full
          tags: |
            type=raw,value=v${{ env.PROJECT_VERSION }}
            type=raw,value=latest
      - name: Docker Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/Dockerfile.full
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            AUTHOR=${{ github.repository_owner }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  clear-temp-artifact:
    name: Clear Temp Artifacts
    if: always()
    runs-on: ubuntu-latest
    needs:
      - release
      - docker-push
      - docker-push-full
    permissions:
      actions: write
      contents: read
    steps:
      - uses: geekyeggo/delete-artifact@v4
        with:
          token: ${{ github.token }}
          name: |
            documents
            lagrange*
            yogurt*
            sealdice-ui
            sealdice-core*
            sealdice_*
            sealdice-prerelease_*
